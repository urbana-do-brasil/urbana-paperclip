schema: spec-driven

context: |
  Language: Português Brasileiro
  All artifacts must be written in Português Brasileiro.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Paperclip is a multi-company control plane for AI agents.
  Stack: TypeScript, Node.js >=24.11.0, pnpm 9.15.4, React/Vite,
  Express, PostgreSQL and Drizzle ORM.
  Follow AGENTS.md and the existing product and engineering documentation.
  doc/SPEC-implementation.md defines the V1 product contract.
  Preserve company isolation, execution locks, approvals and budget enforcement.

rules:
  proposal:
    - State the intended outcome and what is out of scope.
  tasks:
    - Prefer small, verifiable deliveries with only genuine dependencies.
    - Include checks appropriate to the behavior and layers being changed.

operations:
  apply:
    guidance:
      - Start with focused checks; follow AGENTS.md for completion checks.
      - Use disposable state for tests; do not use production data or secrets.
